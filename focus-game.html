<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>60 秒專注力挑戰｜BoBo 自我探索館</title>
<meta name="description" content="BoBo 60 秒專注力挑戰：在順時鐘旋轉的數字圓盤中，依序從 1 找到 50。">
<style>
*{box-sizing:border-box}
:root{--ink:#25534d;--purple:#7b4b83;--lav:#a77aa3}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);text-align:center;background:linear-gradient(180deg,#e9fff2,#fff8dc);min-height:100vh}
.page{max-width:780px;margin:auto;padding:20px 14px 42px}
.back{display:inline-block;margin:4px 0 14px;text-decoration:none;font-weight:800;color:var(--ink)}
.card{background:rgba(255,255,255,.9);border-radius:28px;padding:22px 16px;box-shadow:0 10px 25px rgba(92,136,110,.14)}
h1{margin:0 0 8px;color:var(--purple);font-size:clamp(26px,6vw,34px)}
.sub{margin:0 auto 14px;line-height:1.75;color:#55716a}
.top{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:14px auto}
.stat{background:#f8fff9;border-radius:18px;padding:12px 10px;font-weight:900}
.stat strong{display:block;color:var(--purple);font-size:24px;margin-top:4px}
.game-shell{position:relative;width:min(82vw,430px);aspect-ratio:1;margin:14px auto}
.wheel{position:absolute;inset:0;border-radius:50%;background:#fff;border:2px solid rgba(123,75,131,.15);box-shadow:0 12px 28px rgba(70,110,90,.13);overflow:hidden;transform:rotate(0deg)}
.wheel.spin{animation:spin 28s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.num{position:absolute;left:50%;top:50%;width:10.8%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:clamp(11px,2.8vw,16px);background:#fffdf8;color:#2f3f3a;border:1px solid rgba(80,100,90,.18);box-shadow:0 2px 7px rgba(0,0,0,.05);transform:translate(-50%,-50%);user-select:none;cursor:pointer;touch-action:manipulation}
.num.done{background:#e9fff0;color:#6a7c74;border-color:#b8dfc8}
.num.target{outline:3px solid rgba(167,122,163,.28)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:14%;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;color:var(--purple);box-shadow:0 5px 14px rgba(123,75,131,.16);z-index:2}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:15px auto 0}
button{border:0;border-radius:999px;padding:14px 12px;background:var(--lav);color:#fff;font:800 16px inherit;cursor:pointer;box-shadow:0 7px 16px rgba(130,88,130,.18)}
button.secondary{background:#6e8f84}
button.ghost{background:#fff;color:var(--purple);border:1px solid rgba(123,75,131,.2)}
.msg{min-height:52px;margin:16px auto 0;max-width:560px;padding:12px 14px;border-radius:18px;background:#fffdf6;line-height:1.65}
.note{font-size:13px;color:#71807b;line-height:1.7;margin:12px auto 0;max-width:590px}
@media(max-width:520px){.controls{grid-template-columns:1fr}.card{padding:20px 12px}.game-shell{width:min(82vw,390px)}.num{width:10.2%;font-size:12px}}
@media(prefers-reduced-motion:reduce){.wheel.spin{animation-duration:55s}}
</style>
</head>
<body>
<div class="page">
<a class="back" href="explore.html">← 返回自我探索館</a>
<section class="card">
<h1>🎯 60 秒專注力挑戰</h1>
<p class="sub">按下開始後，圓盤會順時鐘轉動。<br>依序點選 <b>1 → 2 → 3 … → 50</b>。</p>

<div class="top">
  <div class="stat">倒數<strong id="time">60</strong></div>
  <div class="stat">下一個<strong id="next">1</strong></div>
</div>

<div class="game-shell" aria-label="1 到 50 專注力數字圓盤">
  <div class="wheel" id="wheel"></div>
  <div class="center" id="center">1</div>
</div>

<div class="controls">
  <button id="startBtn">▶ 開始</button>
  <button class="secondary" id="pauseBtn">⏸ 暫停</button>
  <button class="ghost" id="resetBtn">↻ 重來</button>
</div>
<div class="msg" id="msg">準備好時按「開始」。每次重來，數字位置都會重新排列。</div>
<p class="note">這是一個休閒專注力互動遊戲，不是醫療、心理或認知能力測驗；沒有排名，也不會上傳遊戲紀錄。</p>
</section>
</div>

<script>
const wheel=document.getElementById('wheel');
const timeEl=document.getElementById('time');
const nextEl=document.getElementById('next');
const center=document.getElementById('center');
const msg=document.getElementById('msg');
let next=1,left=60,timer=null,running=false,finished=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  wheel.innerHTML='';
  const nums=shuffle(Array.from({length:50},(_,i)=>i+1));
  // 4 concentric rings: 14 + 13 + 12 + 11 = 50
  const counts=[14,13,12,11], radii=[44,34,24,14];
  let k=0;
  counts.forEach((count,ri)=>{
    for(let i=0;i<count;i++){
      const n=nums[k++];
      const angle=(Math.PI*2*i/count)-(Math.PI/2)+(ri%2?Math.PI/count:0);
      const x=50+radii[ri]*Math.cos(angle), y=50+radii[ri]*Math.sin(angle);
      const b=document.createElement('button');
      b.type='button'; b.className='num'; b.textContent=n;
      b.style.left=x+'%'; b.style.top=y+'%';
      b.dataset.n=n; b.setAttribute('aria-label','數字 '+n);
      b.addEventListener('click',hit);
      wheel.appendChild(b);
    }
  });
}
function hit(e){
  if(!running||finished)return;
  const n=Number(e.currentTarget.dataset.n);
  if(n===next){
    e.currentTarget.classList.add('done');
    next++;
    if(next===51){finish(true);return}
    nextEl.textContent=next; center.textContent=next;
    msg.textContent='很好，繼續找 '+next+'。';
  }else{
    msg.textContent='現在要找的是 '+next+'，慢慢來。';
  }
}
function start(){
  if(finished) reset();
  if(running)return;
  running=true; wheel.classList.add('spin');
  msg.textContent='開始！先找 '+next+'。';
  timer=setInterval(()=>{
    left--; timeEl.textContent=left;
    if(left<=0) finish(false);
  },1000);
}
function pause(){
  if(!running||finished)return;
  running=false; clearInterval(timer); timer=null;
  wheel.classList.remove('spin');
  msg.textContent='已暫停。準備好再按「開始」。';
}
function finish(done){
  running=false; finished=true; clearInterval(timer); timer=null;
  wheel.classList.remove('spin');
  if(done){
    msg.innerHTML='🎉 完成了！你在時間內找到 1–50。';
    nextEl.textContent='完成'; center.textContent='✓';
  }else{
    msg.innerHTML='⏰ 60 秒到了。你找到 <b>'+Math.max(0,next-1)+'</b>，想再玩一次就按「重來」。';
  }
}
function reset(){
  clearInterval(timer); timer=null; running=false; finished=false; next=1; left=60;
  timeEl.textContent=60; nextEl.textContent=1; center.textContent=1;
  wheel.classList.remove('spin'); build();
  msg.textContent='準備好時按「開始」。每次重來，數字位置都會重新排列。';
}
document.getElementById('startBtn').onclick=start;
document.getElementById('pauseBtn').onclick=pause;
document.getElementById('resetBtn').onclick=reset;
build();
</script>
</body>
</html>
